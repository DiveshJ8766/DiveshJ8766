name: Update profile art

on:
  schedule:
    # 06:17 UTC ≈ 11:47 AM IST — an odd minute so it isn't fighting the
    # top-of-hour stampede on GitHub's shared cron queue.
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Scrape the public contribution calendar
        run: python scripts/fetch_contributions.py
        env:
          GH_USER: ${{ github.repository_owner }}

      - name: Render the SVGs
        working-directory: scripts
        run: |
          python render_heatmap_svg.py
          python make_info_card.py
          python make_projects_panel.py
          python make_skills_panel.py
          python make_timeline_panel.py
          python make_ascii_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: >-
            data/contributions.json
            contrib-heatmap.svg
            info-card.svg
            projects-card.svg
            skills-card.svg
            timeline-card.svg
            divesh-ascii.svg
