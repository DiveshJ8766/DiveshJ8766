<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310"
     font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace" role="img" aria-label="Career timeline: application engineer on a capital markets platform from July 2023, then a KYC registry platform, then software development engineer from April 2026">
  <style>
    text { font-family: ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace; }
    .row { opacity: 0; animation: rise .5s cubic-bezier(.2,.7,.3,1) both 1; }
    .cmd { font-size: 15px; fill: #c9d1d9; }
    .ttl { font-size: 12.5px; font-weight: 600; fill: #c9d1d9; }
    .dom { font-weight: 400; fill: #8b949e; }
    .spn { font-size: 10.5px; fill: #8b949e; }
    .track { opacity: .55; }
    .yr  { font-size: 10.5px; fill: #8b949e; }
    .live { animation: rise .5s cubic-bezier(.2,.7,.3,1) both 1,
                        pulse 2.8s ease-in-out infinite 1s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse { 0%, 100% { filter: none } 50% { filter: brightness(1.3) } }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .row, .live, .cursor { animation: none !important; opacity: 1 !important;
                              transform: none !important; }
    }
  </style>

  <rect x="0.5" y="0.5" width="859" height="309" rx="10"
        fill="#0f141b" stroke="#30363d"/>
  <path d="M0.5 10.5 a10 10 0 0 1 10 -10 h839
           a10 10 0 0 1 10 10 v19.5 h-859 z"
        fill="#161b22" stroke="#30363d"/>
  <circle cx="16" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="33" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="15" r="5" fill="#27c93f"/>
  <text x="430.0" y="19" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#8b949e"
        text-anchor="middle">timeline.sh</text>

  <text class="cmd row" x="24" y="58" style="animation-delay:.1s"><tspan fill="#39d353">$</tspan> git log --date=short --reverse<tspan class="cursor" fill="#39d353"> _</tspan></text>
  <text class="cmd row" x="836" y="58" text-anchor="end" fill="#8b949e"
        style="animation-delay:.2s">3y 3m · 3 roles</text>
  <line class="row" x1="24" y1="70" x2="836" y2="70" stroke="#30363d"
        style="animation-delay:.26s"/>
  <line class="row" x1="148.9" y1="72.0" x2="148.9" y2="270.0" stroke="#30363d" style="animation-delay:.3s"/>
  <text class="yr row" x="154.9" y="288.0" style="animation-delay:.3s">2024</text>
  <line class="row" x1="398.8" y1="72.0" x2="398.8" y2="270.0" stroke="#30363d" style="animation-delay:.3s"/>
  <text class="yr row" x="404.8" y="288.0" style="animation-delay:.3s">2025</text>
  <line class="row" x1="648.6" y1="72.0" x2="648.6" y2="270.0" stroke="#30363d" style="animation-delay:.3s"/>
  <text class="yr row" x="654.6" y="288.0" style="animation-delay:.3s">2026</text>
  <line class="row" x1="24" y1="270.0" x2="836" y2="270.0"
        stroke="#30363d" style="animation-delay:.3s"/>
  <g class="row" style="animation-delay:0.32s">
    <text class="ttl" x="24" y="89.0">Application Engineer<tspan class="dom"> · capital markets trading platform</tspan></text>
    <rect class="track" x="24" y="96.0" width="812" height="16" rx="8.0" fill="#161b22"/>
    <rect class="bar" x="24.0" y="96.0" width="541.3" height="16" rx="8.0" fill="#006d32"/>
    <text class="spn" x="24" y="127.0">Jul 2023 — Aug 2025 · 2y 2m</text>
  </g>
  <g class="row" style="animation-delay:0.46s">
    <text class="ttl" x="24" y="145.0">Application Engineer<tspan class="dom"> · KYC registry platform</tspan></text>
    <rect class="track" x="24" y="152.0" width="812" height="16" rx="8.0" fill="#161b22"/>
    <rect class="bar" x="565.3" y="152.0" width="145.7" height="16" rx="8.0" fill="#26a641"/>
    <text class="spn" x="24" y="183.0">Sep 2025 — Mar 2026 · 7 mo</text>
  </g>
  <g class="row" style="animation-delay:0.6s">
    <text class="ttl" x="24" y="201.0">Software Development Engineer<tspan class="dom"> · services booking &amp; payments platform</tspan></text>
    <rect class="track" x="24" y="208.0" width="812" height="16" rx="8.0" fill="#161b22"/>
    <rect class="bar live" x="711.1" y="208.0" width="124.9" height="16" rx="8.0" fill="#39d353"/>
    <text class="spn" x="24" y="239.0">Apr 2026 — present · 6 mo</text>
  </g>
</svg>
