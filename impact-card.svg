<svg xmlns="http://www.w3.org/2000/svg" width="860" height="248" viewBox="0 0 860 248"
     font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace" role="img"
     aria-label="Impact metrics: 70% faster initial page load, 35% more bookings, 40% faster feature development, 40% more unit test coverage">
  <style>
    text { font-family: ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace; }
    .row { opacity: 0; animation: rise .5s cubic-bezier(.2,.7,.3,1) both 1; }
    .cmd { font-size: 15px; fill: #c9d1d9; }
    .cat { font-size: 11px; fill: #8b949e; letter-spacing: .08em; }
    .val { font-size: 38px; font-weight: 600; fill: #e3b341; }
    .lbl { font-size: 12.5px; fill: #c9d1d9; }
    .also { font-size: 12px; fill: #8b949e; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .row, .cursor { animation: none !important; opacity: 1 !important;
                       transform: none !important; }
    }
  </style>

  <rect x="0.5" y="0.5" width="859" height="247" rx="10"
        fill="#0f141b" stroke="#30363d"/>
  <path d="M0.5 10.5 a10 10 0 0 1 10 -10 h839
           a10 10 0 0 1 10 10 v19.5 h-859 z"
        fill="#161b22" stroke="#30363d"/>
  <circle cx="16" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="33" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="15" r="5" fill="#27c93f"/>
  <text x="430.0" y="19" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#8b949e"
        text-anchor="middle">impact.sh</text>

  <text class="cmd row" x="24" y="58" style="animation-delay:.1s"><tspan fill="#39d353">$</tspan> ./impact --all-roles</text>
  <text class="cmd row" x="836" y="58" text-anchor="end" fill="#8b949e"
        style="animation-delay:.2s">3+ years · 3 roles</text>
  <line class="row" x1="24" y1="70" x2="836" y2="70" stroke="#30363d"
        style="animation-delay:.28s"/>
  <g class="row" style="animation-delay:0.35s">
    <text class="cat" x="24.0" y="92">performance</text>
    <text class="val" x="24.0" y="138">−70%</text>
    <text class="lbl" x="24.0" y="164">initial page load</text>
  </g>
  <g class="row" style="animation-delay:0.46s">
    <text class="cat" x="232.0" y="92">business</text>
    <text class="val" x="232.0" y="138">+35%</text>
    <text class="lbl" x="232.0" y="164">bookings from waitlist</text>
  </g>
  <line class="row" x1="222.0" y1="74" x2="222.0" y2="170" stroke="#30363d" style="animation-delay:0.46s"/>
  <g class="row" style="animation-delay:0.57s">
    <text class="cat" x="440.0" y="92">velocity</text>
    <text class="val" x="440.0" y="138">40%</text>
    <text class="lbl" x="440.0" y="164">faster feature dev</text>
  </g>
  <line class="row" x1="430.0" y1="74" x2="430.0" y2="170" stroke="#30363d" style="animation-delay:0.57s"/>
  <g class="row" style="animation-delay:0.68s">
    <text class="cat" x="648.0" y="92">quality</text>
    <text class="val" x="648.0" y="138">+40%</text>
    <text class="lbl" x="648.0" y="164">unit test coverage</text>
  </g>
  <line class="row" x1="638.0" y1="74" x2="638.0" y2="170" stroke="#30363d" style="animation-delay:0.68s"/>
  <line class="row" x1="24" y1="192" x2="836" y2="192"
        stroke="#30363d" style="animation-delay:0.89s"/>
  <text class="also row" x="24" y="216" style="animation-delay:0.89s">
    <tspan fill="#8b949e">also </tspan>−60% API calls · −30% bundle size · −80% UI freezes · −80% manual form setup · WCAG 2.1 AA<tspan class="cursor" fill="#39d353"> _</tspan>
  </text>
</svg>
